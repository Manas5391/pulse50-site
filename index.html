<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <title>Pulse50 — India & World News in 50 Words</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <!-- Google AdSense Verification Tag (Preserved Untouched) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8456169895588415" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #090d16; color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Telugu", "Noto Sans Tamil", "Noto Sans Gujarati", "Noto Nastaliq Urdu", "Noto Sans Kannada", "Noto Sans Oriya", "Noto Sans Malayalam", "Noto Sans Gurmukhi", sans-serif;
    }
    .snap-feed {
      height: calc(100dvh - 152px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .snap-feed::-webkit-scrollbar { display: none; }
    .news-card {
      height: calc(100dvh - 152px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .cat-bar { scrollbar-width: none; }
    .cat-bar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- Top App Header with 13-Language Dropdown -->
  <header class="h-14 px-3 flex items-center justify-between bg-slate-950 border-b border-slate-800/90 shrink-0 z-30 gap-1.5">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-white text-xs shadow-md shadow-indigo-950 shrink-0">P50</div>
      <div class="truncate">
        <div class="flex items-center gap-1.5">
          <h1 id="appTitle" class="text-sm font-bold leading-tight text-white truncate">Pulse50</h1>
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
        </div>
        <p id="syncStatus" class="text-[10px] text-slate-400 truncate">50-Word Live Desk</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <!-- Global Language Filter (13 Major Indian Languages — Applies Uniformly Across All 9 Tabs & 28 States) -->
      <select id="langSelect" onchange="changeAppLanguage(this.value)" aria-label="Select Language" class="h-8 px-2 rounded-lg bg-indigo-950/90 text-indigo-200 text-xs font-bold border border-indigo-500/50 focus:outline-none">
        <option value="en">English</option>
        <option value="hi">हिंदी • Hindi</option>
        <option value="bn">বাংলা • Bengali</option>
        <option value="mr">मराठी • Marathi</option>
        <option value="te">తెలుగు • Telugu</option>
        <option value="ta">தமிழ் • Tamil</option>
        <option value="gu">ગુજરાતી • Gujarati</option>
        <option value="ur">اردو • Urdu</option>
        <option value="kn">ಕನ್ನಡ • Kannada</option>
        <option value="or">ଓଡ଼ିଆ • Odia</option>
        <option value="ml">മലയാളം • Malayalam</option>
        <option value="pa">ਪੰਜਾਬੀ • Punjabi</option>
        <option value="as">অসমীয়া • Assamese</option>
      </select>

      <button onclick="toggleSearchBar()" aria-label="Search News" class="w-8 h-8 rounded-lg bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-xs border border-slate-700/70">🔍</button>
      <button onclick="openNotificationsModal()" aria-label="Trending Alerts" class="relative w-8 h-8 rounded-lg bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-xs border border-slate-700/70">
        <span>🔔</span>
        <span id="alertDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="fetchLiveNews('manual')" class="px-2 py-1.5 rounded-lg bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 text-xs font-semibold border border-emerald-700/50 flex items-center gap-1">
        <span id="refreshIcon">↻</span>
      </button>
    </div>
  </header>

  <!-- 9 Locked Category Tabs -->
  <nav id="categoryBar" class="h-12 px-3 flex items-center gap-2 overflow-x-auto cat-bar bg-slate-900/95 border-b border-slate-800 shrink-0 z-20"></nav>

  <!-- Expandable Keyword Search Bar -->
  <div id="searchBarContainer" class="hidden px-3 py-2 bg-slate-900 border-b border-slate-800 flex items-center gap-2 shrink-0 z-20">
    <input id="searchInput" type="search" oninput="handleSearchInput(this.value)" placeholder="Search headlines, districts, states, or topics..." class="flex-1 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500" />
    <button onclick="clearSearch()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold">Clear</button>
  </div>

  <!-- Translation Progress Banner -->
  <div id="translatingBanner" class="hidden px-3 py-1 bg-indigo-950/95 border-b border-indigo-700/50 text-[11px] text-indigo-200 text-center font-medium shrink-0">
    Translating stories into your selected language...
  </div>

  <!-- Main Vertical Snap Feed -->
  <main id="feedContainer" class="snap-feed relative"></main>

  <!-- AdSense-Safe Policy & Navigation Footer -->
  <footer id="adFooter" class="h-12 px-3.5 bg-slate-950 border-t border-slate-800/90 flex items-center justify-between text-[11px] text-slate-400 shrink-0 z-20">
    <span class="font-semibold text-slate-300">© 2026 Pulse50 News</span>
    <div class="flex items-center gap-3">
      <a href="/about.html" class="hover:text-indigo-400 transition">About</a>
      <a href="/contact.html" class="hover:text-indigo-400 transition">Contact</a>
      <a href="/privacy-policy.html" class="hover:text-indigo-400 transition">Privacy</a>
      <a href="/terms.html" class="hover:text-indigo-400 transition">Terms</a>
    </div>
  </footer>

  <!-- Trending Alerts Modal -->
  <div id="notificationsModal" class="fixed inset-0 bg-black/85 z-50 hidden items-end sm:items-center justify-center p-3">
    <div class="max-w-md w-full bg-slate-900 rounded-2xl border border-slate-700 overflow-hidden max-h-[82dvh] flex flex-col">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-sm text-white">Trending India & World Alerts</h2>
          <p class="text-[11px] text-slate-400">Tap any alert to jump directly to the story</p>
        </div>
        <button onclick="closeNotificationsModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs font-bold">✕</button>
      </div>
      <div id="alertsList" class="p-3 space-y-2 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col justify-center p-4">
    <div class="max-w-xl w-full mx-auto bg-slate-900 rounded-2xl overflow-hidden border border-slate-700">
      <div class="p-3 flex items-center justify-between border-b border-slate-800">
        <span id="modalSource" class="text-xs font-bold text-indigo-400 uppercase">Video Coverage</span>
        <button onclick="closeVideo()" class="px-3 py-1 rounded bg-slate-800 text-xs font-bold">Close ✕</button>
      </div>
      <div class="aspect-video bg-black">
        <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div class="p-3.5">
        <h3 id="modalTitle" class="font-bold text-sm text-white"></h3>
      </div>
    </div>
  </div>

  <script>
    const NEWS_JSON_CDN = "https://raw.githubusercontent.com/Manas5391/pulse50-site/main/news.json";
    const CACHE_KEY = "pulse50_stories_v11";
    const TRANS_CACHE_KEY = "pulse50_trans_v3";

    const CATEGORIES = [
      "General",
      "India National",
      "World",
      "State",
      "Sports",
      "Politics",
      "Science & Education",
      "Entertainment",
      "Podcasts"
    ];

    const INDIAN_STATES_28 = [
      "Odisha", "Telangana", "Andhra Pradesh", "Maharashtra", "Karnataka",
      "Tamil Nadu", "West Bengal", "Uttar Pradesh", "Bihar", "Gujarat",
      "Rajasthan", "Madhya Pradesh", "Kerala", "Punjab", "Haryana",
      "Assam", "Chhattisgarh", "Jharkhand", "Uttarakhand", "Himachal Pradesh",
      "Arunachal Pradesh", "Goa", "Manipur", "Meghalaya", "Mizoram",
      "Nagaland", "Sikkim", "Tripura"
    ];

    let activeCategory = "General";
    let selectedState = localStorage.getItem("pulse50_state") || "Odisha";
    let selectedLang = localStorage.getItem("pulse50_lang") || "en";
    let searchQuery = "";
    let pinnedAlertStoryId = null;

    function safeLoadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    let liveNewsItems = safeLoadJSON(CACHE_KEY, []);
    let translationCache = safeLoadJSON(TRANS_CACHE_KEY, {});
    let currentTrendingAlerts = [];

    document.getElementById("langSelect").value = selectedLang;

    function buildVibrantSourceBanner(sourceName, topicLabel, seedIdx = 0) {
      const gradients = [
        "from-indigo-600 via-purple-600 to-pink-500",
        "from-emerald-500 via-teal-600 to-cyan-600",
        "from-amber-500 via-orange-600 to-rose-600",
        "from-sky-500 via-blue-600 to-indigo-700",
        "from-fuchsia-600 via-purple-600 to-indigo-600"
      ];
      const grad = gradients[Math.abs(seedIdx + (sourceName || "").length) % gradients.length];
      const cleanSource = (sourceName || "Pulse50 Desk").trim();
      const initials = cleanSource.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "P50";
      return `
        <div class="w-full h-full bg-gradient-to-br ${grad} flex flex-col items-center justify-center p-4 text-center relative overflow-hidden">
          <div class="w-11 h-11 rounded-2xl bg-white/20 backdrop-blur-md border border-white/40 shadow-lg flex items-center justify-center text-white font-black text-sm tracking-wider mb-1.5">${initials}</div>
          <span class="text-white font-extrabold text-sm tracking-wide drop-shadow">${cleanSource}</span>
          <span class="mt-1 px-2.5 py-0.5 rounded-full bg-black/25 text-white/95 text-[10px] font-semibold uppercase tracking-widest">${topicLabel || "Verified Report"}</span>
        </div>`;
    }

    // Sentence-aware backup translator (only used if a story lacks pre-generated Gemini editorial text)
    async function translateSentenceBlock(text, targetLang) {
      if (!text || targetLang === "en") return text;
      const cacheKey = `${targetLang}:${text.slice(0, 80)}:${text.length}`;
      if (translationCache[cacheKey]) return translationCache[cacheKey];

      // Normalize currency like "Rs. 2.30 crores" to "INR 2.30 crore" so numbers never split mid-sentence
      const normalized = text.replace(/\bRs\.?\s*(\d+(?:\.\d+)?)\s*(crores?|lakhs?)/gi, "₹$1 $2");

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(normalized)}`;
        const res = await fetch(url);
        if (!res.ok) return text;
        const data = await res.json();
        const translated = Array.isArray(data?.[0]) ? data[0].map(seg => seg[0] || "").join("") : text;
        if (translated && translated.trim()) {
          translationCache[cacheKey] = translated.trim();
          try {
            const keys = Object.keys(translationCache);
            if (keys.length > 600) delete translationCache[keys[0]];
            localStorage.setItem(TRANS_CACHE_KEY, JSON.stringify(translationCache));
          } catch {}
          return translated.trim();
        }
      } catch {}
      return text;
    }

    async function ensureLanguageReadyForVisible(stories, targetLang) {
      if (targetLang === "en") return;
      const banner = document.getElementById("translatingBanner");
      const missing = stories.slice(0, 20).filter(item => {
        if (item.translations?.[targetLang]?.title && item.translations?.[targetLang]?.summary) return false;
        const kTitle = `${targetLang}:${item.title.slice(0, 80)}:${item.title.length}`;
        return !translationCache[kTitle];
      });

      if (!missing.length) return;
      banner.classList.remove("hidden");

      await Promise.all(missing.map(async (item) => {
        await Promise.all([
          translateSentenceBlock(item.title, targetLang),
          translateSentenceBlock(item.summary, targetLang)
        ]);
      }));

      banner.classList.add("hidden");
      renderFeed(true);
    }

    function getLocalizedField(item, field) {
      if (selectedLang === "en") {
        return item.translations?.en?.[field] || item[field] || "";
      }
      if (item.translations?.[selectedLang]?.[field]) {
        return item.translations[selectedLang][field];
      }
      const raw = item[field] || "";
      const cacheKey = `${selectedLang}:${raw.slice(0, 80)}:${raw.length}`;
      return translationCache[cacheKey] || raw;
    }

    function changeAppLanguage(newLang) {
      selectedLang = newLang;
      localStorage.setItem("pulse50_lang", newLang);
      renderFeed();
    }

    // Selecting a state NEVER overrides the user's chosen language filter
    function changeIndianState(newState) {
      selectedState = newState;
      localStorage.setItem("pulse50_state", newState);
      renderCategories();
      renderFeed();
    }

    async function fetchLiveNews(mode = "initial") {
      const icon = document.getElementById("refreshIcon");
      if (icon && mode !== "silent") icon.classList.add("animate-spin");

      try {
        const res = await fetch(`${NEWS_JSON_CDN}?_cb=${Math.floor(Date.now() / 60000)}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            liveNewsItems = data;
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(liveNewsItems)); } catch {}
            localStorage.setItem("pulse50_last_sync", Date.now().toString());
            updateAlerts(liveNewsItems);
            renderFeed();
          }
        }
      } finally {
        if (icon) icon.classList.remove("animate-spin");
        updateHeaderStatus();
      }
    }

    function updateHeaderStatus() {
      const lastSync = Number(localStorage.getItem("pulse50_last_sync") || 0);
      const timeStr = lastSync ? new Date(lastSync).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "Live";
      document.getElementById("syncStatus").textContent = `50-Word Desk • ${timeStr}`;
    }

    function timeAgo(timestamp) {
      if (!timestamp) return "Just now";
      const mins = Math.max(1, Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000));
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return hrs < 24 ? `${hrs}h ago` : `${Math.floor(hrs / 24)}d ago`;
    }

    function renderCategories() {
      document.getElementById("categoryBar").innerHTML = CATEGORIES.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          activeCategory === cat ? "bg-indigo-600 text-white shadow" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
        }">${cat === "State" ? `State: ${selectedState}` : cat}</button>
      `).join("");
    }

    function selectCategory(cat) {
      activeCategory = cat;
      pinnedAlertStoryId = null;
      renderCategories();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function updateAlerts(stories) {
      currentTrendingAlerts = stories
        .filter(s => Array.isArray(s.tags) && (s.tags.includes("World") || s.tags.includes("India National")))
        .slice(0, 15);
      if (currentTrendingAlerts.length) document.getElementById("alertDot").classList.remove("hidden");
    }

    function openNotificationsModal() {
      const list = document.getElementById("alertsList");
      if (!currentTrendingAlerts.length) updateAlerts(liveNewsItems);
      list.innerHTML = currentTrendingAlerts.map((item, idx) => `
        <button onclick="openAlertByIndex(${idx})" class="w-full text-left p-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/70 transition">
          <div class="flex items-center justify-between text-[10px] text-indigo-400 font-semibold mb-1">
            <span>${item.source}</span>
            <span>${timeAgo(item.pubDate)}</span>
          </div>
          <p class="text-xs font-bold text-white line-clamp-2">${getLocalizedField(item, "title")}</p>
        </button>
      `).join("") || `<p class="text-xs text-slate-400 text-center py-6">No alerts right now.</p>`;
      document.getElementById("notificationsModal").classList.remove("hidden");
      document.getElementById("notificationsModal").classList.add("flex");
    }

    function closeNotificationsModal() {
      document.getElementById("notificationsModal").classList.add("hidden");
      document.getElementById("notificationsModal").classList.remove("flex");
    }

    function openAlertByIndex(idx) {
      const story = currentTrendingAlerts[idx];
      closeNotificationsModal();
      if (!story) return;
      pinnedAlertStoryId = story.id;
      activeCategory = "General";
      searchQuery = "";
      document.getElementById("searchBarContainer").classList.add("hidden");
      renderCategories();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function toggleSearchBar() {
      const bar = document.getElementById("searchBarContainer");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) document.getElementById("searchInput").focus();
      else clearSearch();
    }

    function handleSearchInput(val) {
      searchQuery = val.trim().toLowerCase();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function clearSearch() {
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      renderFeed();
    }

    function shareStory(title, link) {
      const text = `${title}\nRead in 50 words on Pulse50: ${link}`;
      if (navigator.share) navigator.share({ title, text, url: link }).catch(() => {});
      else navigator.clipboard?.writeText(text);
    }

    function renderFeed(skipTranslationTrigger = false) {
      const feed = document.getElementById("feedContainer");

      let filtered = liveNewsItems.filter(item => {
        if (searchQuery) {
          const hay = `${item.title} ${item.summary} ${getLocalizedField(item, "title")} ${getLocalizedField(item, "summary")} ${item.source} ${(item.stateTags || []).join(" ")}`.toLowerCase();
          return hay.includes(searchQuery);
        }
        if (activeCategory === "General") return Array.isArray(item.tags) && item.tags.includes("General");
        if (activeCategory === "State") return Array.isArray(item.stateTags) && item.stateTags.includes(selectedState);
        return Array.isArray(item.tags) && item.tags.includes(activeCategory);
      });

      if (pinnedAlertStoryId) {
        const pinned = liveNewsItems.find(s => s.id === pinnedAlertStoryId);
        if (pinned) filtered = [pinned, ...filtered.filter(s => s.id !== pinnedAlertStoryId)];
      }

      if (!skipTranslationTrigger && filtered.length) {
        ensureLanguageReadyForVisible(filtered, selectedLang);
      }

      const stateBarHtml = activeCategory === "State" && !searchQuery ? `
        <div class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur px-4 py-2 border-b border-slate-800 flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-indigo-300">Select State (District Feed):</span>
          <select onchange="changeIndianState(this.value)" class="bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700">
            ${INDIAN_STATES_28.map(st => `<option value="${st}" ${st === selectedState ? "selected" : ""}>${st}</option>`).join("")}
          </select>
        </div>` : "";

      if (!filtered.length) {
        feed.innerHTML = stateBarHtml + `
          <div class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-400">
            <p class="text-sm mb-3">Loading latest stories for ${activeCategory === "State" ? selectedState : activeCategory}...</p>
            <button onclick="fetchLiveNews('manual')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Refresh Feed</button>
          </div>`;
        return;
      }

      const isRtl = selectedLang === "ur";

      feed.innerHTML = stateBarHtml + filtered.slice(0, 80).map((item, idx) => {
        const isPodcast = item.category === "Podcasts";
        const displayTitle = getLocalizedField(item, "title");
        const displaySummary = getLocalizedField(item, "summary");
        const safeLink = item.link || "https://news.google.com";
        const safeSource = String(item.source || "Pulse50 Desk").replace(/'/g, "\\'");
        const safeCat = String((item.stateTags && item.stateTags[0]) || item.primaryCategory || item.category || "News").replace(/'/g, "\\'");
        const safeTitleForJs = String(displayTitle || "").replace(/'/g, "\\'");
        const hasVideo = Boolean(item.video);

        const mediaBoxClass = isPodcast
          ? "relative w-full aspect-video max-h-[34%] bg-black overflow-hidden shrink-0"
          : "relative h-[30%] w-full overflow-hidden shrink-0 bg-slate-900";
        const mediaImgClass = isPodcast
          ? "w-full h-full object-contain transition-opacity duration-300"
          : "w-full h-full object-cover object-top transition-opacity duration-300";

        return `
          <article data-story-id="${item.id}" class="news-card flex flex-col justify-between bg-slate-950 border-b border-slate-900">
            <div class="${mediaBoxClass}">
              ${item.image ? `
                <img src="${item.image}" alt="${displayTitle}"
                  onload="if (!${isPodcast} && (this.naturalWidth < 480 || this.naturalHeight < 240)) { this.onerror(); }"
                  onerror="if (this.src.includes('maxresdefault.jpg')) { this.src = this.src.replace('maxresdefault.jpg', 'hqdefault.jpg'); return; } this.parentElement.innerHTML = buildVibrantSourceBanner('${safeSource}', '${safeCat}', ${idx})"
                  class="${mediaImgClass}" />
                ${isPodcast ? "" : `<div class="absolute inset-0 bg-gradient-to-t from-slate-950/75 via-transparent to-black/15"></div>`}
              ` : buildVibrantSourceBanner(item.source, safeCat, idx)}
            </div>

            <div class="flex-1 px-4 py-3.5 flex flex-col justify-between overflow-hidden" dir="${isRtl ? "rtl" : "ltr"}">
              <div>
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1.5" dir="ltr">
                  <span class="font-semibold text-indigo-400 truncate">${item.source} • ${timeAgo(item.pubDate)}</span>
                </div>
                <h2 class="text-[17px] sm:text-lg font-extrabold leading-snug mb-2 text-white line-clamp-3">${displayTitle}</h2>
                <p class="text-[14.5px] leading-relaxed text-slate-300">${displaySummary}</p>
              </div>

              <div class="pt-2 flex items-center gap-2 shrink-0" dir="ltr">
                ${hasVideo ? `
                  <button onclick='openVideo(${JSON.stringify({ source: item.source, title: displayTitle, video: item.video, link: safeLink }).replace(/'/g, "&#39;")})' class="py-2.5 px-3.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    <span>▶ Watch</span>
                  </button>
                ` : ""}
                <a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow text-center">
                  <span>Read Full Story ↗</span>
                </a>
                <button onclick="shareStory('${safeTitleForJs}', '${safeLink}')" aria-label="Share story" class="py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700">
                  Share
                </button>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    function openVideo(item) {
      if (!item.video) {
        window.open(item.link, "_blank", "noopener,noreferrer");
        return;
      }
      document.getElementById("modalSource").textContent = item.source;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("videoFrame").src = item.video;
      document.getElementById("videoModal").classList.remove("hidden");
      document.getElementById("videoModal").classList.add("flex");
    }

    function closeVideo() {
      document.getElementById("videoFrame").src = "";
      document.getElementById("videoModal").classList.add("hidden");
      document.getElementById("videoModal").classList.remove("flex");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }

    updateHeaderStatus();
    renderCategories();
    updateAlerts(liveNewsItems);
    renderFeed();
    fetchLiveNews("initial");

    setInterval(() => {
      if (document.visibilityState === "visible") fetchLiveNews("silent");
    }, 180000);
  </script>
</body>
</html>
