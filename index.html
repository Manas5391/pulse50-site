<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <title>Pulse50 — India & World News in 50 Words</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <!-- Google AdSense Verification Tag (Preserved Untouched) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8456169895588415" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #090d16; color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 56px header + 48px tabs + 48px footer = 152px */
    .snap-feed {
      height: calc(100dvh - 152px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .snap-feed::-webkit-scrollbar { display: none; }
    .news-card {
      height: calc(100dvh - 152px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .cat-bar { scrollbar-width: none; }
    .cat-bar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- Top App Header -->
  <header class="h-14 px-3.5 flex items-center justify-between bg-slate-950 border-b border-slate-800/90 shrink-0 z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-white text-xs shadow-md shadow-indigo-950">P50</div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 id="appTitle" class="text-sm font-bold leading-tight text-white">Pulse50 News</h1>
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="Live Feed Active"></span>
        </div>
        <p id="syncStatus" class="text-[10px] text-slate-400">50-Word Editorial Desk • Syncing...</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="toggleSearchBar()" aria-label="Search News" class="w-8 h-8 rounded-lg bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-xs border border-slate-700/70">🔍</button>
      <button onclick="openNotificationsModal()" aria-label="Trending Alerts" class="relative w-8 h-8 rounded-lg bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-xs border border-slate-700/70">
        <span>🔔</span>
        <span id="alertDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="fetchLiveNews('manual')" class="px-2.5 py-1.5 rounded-lg bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 text-xs font-semibold border border-emerald-700/50 flex items-center gap-1">
        <span id="refreshIcon">↻</span> Live
      </button>
      <button onclick="openStudio()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold border border-slate-700">Studio</button>
    </div>
  </header>

  <!-- Locked Category Tabs -->
  <nav id="categoryBar" class="h-12 px-3 flex items-center gap-2 overflow-x-auto cat-bar bg-slate-900/95 border-b border-slate-800 shrink-0 z-20"></nav>

  <!-- Expandable Keyword Search Bar -->
  <div id="searchBarContainer" class="hidden px-3 py-2 bg-slate-900 border-b border-slate-800 flex items-center gap-2 shrink-0 z-20">
    <input id="searchInput" type="search" oninput="handleSearchInput(this.value)" placeholder="Search headlines, podcasts, states, or keywords..." class="flex-1 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500" />
    <button onclick="clearSearch()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold">Clear</button>
  </div>

  <!-- Floating New Feeds Pill -->
  <button id="newStoriesPill" onclick="applyPendingStories()" class="hidden fixed top-[110px] left-1/2 -translate-x-1/2 z-40 px-4 py-1.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-xl shadow-indigo-950/90 border border-indigo-400/50 flex items-center gap-1.5 transition-all">
    <span>↑</span><span>New Feeds Available</span>
  </button>

  <!-- Main Vertical Snap Feed -->
  <main id="feedContainer" class="snap-feed relative"></main>

  <!-- Clean AdSense-Safe Policy & Navigation Footer -->
  <footer id="adFooter" class="h-12 px-3.5 bg-slate-950 border-t border-slate-800/90 flex items-center justify-between text-[11px] text-slate-400 shrink-0 z-20">
    <span class="font-semibold text-slate-300">© 2026 Pulse50 News</span>
    <div class="flex items-center gap-3">
      <a href="/about.html" class="hover:text-indigo-400 transition">About</a>
      <a href="/contact.html" class="hover:text-indigo-400 transition">Contact</a>
      <a href="/privacy-policy.html" class="hover:text-indigo-400 transition">Privacy</a>
      <a href="/terms.html" class="hover:text-indigo-400 transition">Terms</a>
    </div>
  </footer>

  <!-- Trending Alerts Drawer -->
  <div id="notificationsModal" class="fixed inset-0 bg-black/85 z-50 hidden items-end sm:items-center justify-center p-3">
    <div class="max-w-md w-full bg-slate-900 rounded-2xl border border-slate-700 overflow-hidden max-h-[82dvh] flex flex-col">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-sm text-white">Trending World & India Alerts</h2>
          <p class="text-[11px] text-slate-400">Tap any alert to jump directly to the story</p>
        </div>
        <button onclick="closeNotificationsModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs font-bold">✕</button>
      </div>
      <div id="alertsList" class="p-3 space-y-2 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col justify-center p-4">
    <div class="max-w-xl w-full mx-auto bg-slate-900 rounded-2xl overflow-hidden border border-slate-700">
      <div class="p-3 flex items-center justify-between border-b border-slate-800">
        <span id="modalSource" class="text-xs font-bold text-indigo-400 uppercase">Video Coverage</span>
        <button onclick="closeVideo()" class="px-3 py-1 rounded bg-slate-800 text-xs font-bold">Close ✕</button>
      </div>
      <div class="aspect-video bg-black">
        <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div class="p-3.5">
        <h3 id="modalTitle" class="font-bold text-sm text-white"></h3>
      </div>
    </div>
  </div>

  <!-- Owner Studio Modal -->
  <div id="studioModal" class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 rounded-2xl p-5 border border-slate-700 space-y-3 max-h-[90dvh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-base">Owner Studio & Editorial Desk</h2>
        <button onclick="closeStudio()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div>
        <label class="text-xs text-slate-400">Focus Indian State (All 28 States)</label>
        <select id="inputDefaultState" class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm"></select>
      </div>
      <button onclick="saveBranding()" class="w-full py-2 rounded-lg bg-indigo-600 font-semibold text-sm">Save State Preference</button>
      <hr class="border-slate-800" />
      <h3 class="font-semibold text-sm">Pin Custom Story (Strict ≤ 50 Words)</h3>
      <input id="newsHeadline" placeholder="Headline" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" />
      <select id="newsCategory" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm">
        <option>General</option>
        <option>India National</option>
        <option>World</option>
        <option>India States</option>
        <option>Politics</option>
        <option>Sports</option>
        <option>Entertainment</option>
        <option>Podcasts</option>
      </select>
      <textarea id="newsBody" rows="3" oninput="updateWordCount()" placeholder="Write factual 45-50 word summary..." class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm"></textarea>
      <div class="flex justify-between text-xs">
        <span id="wordCounter" class="text-emerald-400 font-semibold">0 / 50 words</span>
        <span class="text-slate-400">Complete sentences</span>
      </div>
      <input id="newsSource" placeholder="Source Name (e.g., The Hindu, Reuters)" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" />
      <input id="newsImage" placeholder="HD Image URL (optional)" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" />
      <input id="newsLink" placeholder="Full Article URL (https://...)" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" />
      <input id="newsVideo" placeholder="YouTube URL (optional)" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" />
      <button onclick="publishNews()" class="w-full py-2.5 rounded-lg bg-emerald-600 font-bold text-sm">Pin Story to Top</button>
    </div>
  </div>

  <script>
    const MAX_FEED_WINDOW = 600;
    const CATEGORIES = [
      "General",
      "India National",
      "World",
      "India States",
      "Politics",
      "Sports",
      "Entertainment",
      "Podcasts"
    ];

    const INDIAN_STATES_28 = [
      "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh",
      "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand",
      "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur",
      "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab",
      "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura",
      "Uttar Pradesh", "Uttarakhand", "West Bengal"
    ];

    const SEED_STORIES = [
      {
        id: "seed-india-1",
        primaryCategory: "India National",
        tags: ["General", "India National"],
        stateTags: [],
        title: "India Expands Digital Public Infrastructure to Rural Cooperatives",
        summary: "The Union Ministry launched unified digital payment and crop advisory systems across forty thousand rural agricultural societies. Officials confirmed the platform streamlines direct subsidy transfers, live market pricing, and local weather alerts so smallholder farmers nationwide receive timely support without middleman delays.",
        source: "The Hindu",
        image: "",
        video: "",
        link: "https://www.thehindu.com/news/national/",
        pubDate: Date.now()
      }
    ];

    let activeCategory = "General";
    let selectedState = localStorage.getItem("pulse50_state") || "Telangana";
    let searchQuery = "";
    let pinnedAlertStoryId = null;

    function safeLoadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    let customPinnedNews = safeLoadJSON("pulse50_pinned_v7", []);
    let liveNewsItems = safeLoadJSON("pulse50_ai_feed_v7", null) || SEED_STORIES;
    let pendingFreshItems = null;
    let currentTrendingAlerts = [];

    function countWords(str) {
      return String(str || "").trim().split(/\s+/).filter(Boolean).length;
    }

    function upgradeToHighResImage(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string" || !rawUrl.startsWith("http")) return "";
      const lower = rawUrl.toLowerCase();
      if (
        lower.includes("googleusercontent.com") ||
        lower.includes("gstatic.com") ||
        lower.includes("news.google.com") ||
        lower.includes("pixel") ||
        lower.includes("logo") ||
        lower.includes("icon") ||
        lower.includes("1x1")
      ) {
        return "";
      }
      return rawUrl
        .replace(/([?&])(w|width|h|height|quality|q)=\d+/gi, "")
        .replace(/resize=\d+[,x]\d+/gi, "resize=1200,675")
        .replace(/-\d{2,3}x\d{2,3}(\.(?:jpg|jpeg|png|webp))/gi, "$1")
        .replace(/(_thumb|_small|_medium|\/thumb\/)/gi, "")
        .replace(/[?&]+$/, "");
    }

    function buildVibrantSourceBanner(sourceName, topicLabel, seedIdx = 0) {
      const gradients = [
        "from-indigo-600 via-purple-600 to-pink-500",
        "from-emerald-500 via-teal-600 to-cyan-600",
        "from-amber-500 via-orange-600 to-rose-600",
        "from-sky-500 via-blue-600 to-indigo-700",
        "from-fuchsia-600 via-purple-600 to-indigo-600",
        "from-rose-500 via-pink-600 to-amber-500"
      ];
      const grad = gradients[Math.abs(seedIdx + (sourceName || "").length) % gradients.length];
      const cleanSource = (sourceName || "Pulse50 News").trim();
      const initials = cleanSource
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(w => w[0].toUpperCase())
        .join("") || "P50";

      return `
        <div class="w-full h-full bg-gradient-to-br ${grad} flex flex-col items-center justify-center p-4 text-center relative overflow-hidden">
          <div class="absolute -top-8 -right-8 w-32 h-32 rounded-full bg-white/15 blur-xl"></div>
          <div class="absolute -bottom-8 -left-8 w-32 h-32 rounded-full bg-black/15 blur-xl"></div>
          <div class="w-11 h-11 rounded-2xl bg-white/20 backdrop-blur-md border border-white/40 shadow-lg flex items-center justify-center text-white font-black text-sm tracking-wider mb-1.5">
            ${initials}
          </div>
          <span class="text-white font-extrabold text-sm tracking-wide drop-shadow">${cleanSource}</span>
          <span class="mt-1 px-2.5 py-0.5 rounded-full bg-black/25 text-white/95 text-[10px] font-semibold uppercase tracking-widest">
            ${topicLabel || "Verified Report"}
          </span>
        </div>
      `;
    }

    // Normalize items loaded from ./news.json (generated automatically by update-news.js)
    function normalizeJsonItem(raw) {
      const primaryCategory = raw.primaryCategory || raw.category || "General";
      const stateList = Array.isArray(raw.stateTags)
        ? raw.stateTags
        : (raw.state ? [raw.state] : []);
      const tags = Array.isArray(raw.tags)
        ? raw.tags
        : Array.from(new Set(["General", primaryCategory, ...(stateList.length ? ["India States"] : [])]));

      let video = raw.video || "";
      const link = raw.link || "https://news.google.com";
      if (!video && /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/.test(link)) {
        const vidId = link.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)[1];
        video = `https://www.youtube.com/embed/${vidId}?autoplay=1`;
      }

      return {
        id: raw.id || btoa(unescape(encodeURIComponent(raw.title || ""))).slice(0, 22),
        primaryCategory,
        tags,
        stateTags: stateList,
        title: (raw.title || "").trim(),
        summary: (raw.summary || "").trim(),
        source: (raw.source || "Pulse50 Desk").trim(),
        image: upgradeToHighResImage(raw.image || ""),
        video,
        link,
        pubDate: raw.pubDate ? new Date(raw.pubDate).getTime() : Date.now()
      };
    }

    // Primary Feed Loader: Reads AI-rewritten 50-word stories directly from ./news.json
    async function fetchLiveNews(mode = "initial") {
      const icon = document.getElementById("refreshIcon");
      const statusEl = document.getElementById("syncStatus");
      if (icon && mode !== "silent") icon.classList.add("animate-spin");
      if (mode === "manual" && statusEl) statusEl.textContent = "Loading 50-word AI feed...";

      try {
        const res = await fetch(`./news.json?v=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("news.json unavailable");
        const rawList = await res.json();
        if (!Array.isArray(rawList) || rawList.length === 0) throw new Error("Empty news.json");

        // Reject any legacy placeholder text if ever encountered
        const validItems = rawList
          .map(normalizeJsonItem)
          .filter(item =>
            item.title &&
            item.summary &&
            !/full details, official statements, and complete coverage/i.test(item.summary)
          )
          .slice(0, MAX_FEED_WINDOW);

        if (validItems.length > 0) {
          const existingIds = new Set(liveNewsItems.map(i => i.id));
          const brandNewCount = validItems.filter(s => !existingIds.has(s.id)).length;
          const feedEl = document.getElementById("feedContainer");

          if (mode === "silent" && brandNewCount > 0 && feedEl.scrollTop > 120) {
            pendingFreshItems = validItems;
            document.getElementById("newStoriesPill").classList.remove("hidden");
          } else {
            liveNewsItems = validItems;
            try {
              localStorage.setItem("pulse50_ai_feed_v7", JSON.stringify(liveNewsItems));
            } catch (e) {}
            renderFeed();
          }
          updateAlerts(liveNewsItems);
          localStorage.setItem("pulse50_last_sync", Date.now().toString());
        }
      } catch (err) {
        console.warn("Feed sync notice:", err.message);
      } finally {
        if (icon) icon.classList.remove("animate-spin");
        updateHeaderStatus();
      }
    }

    function applyPendingStories() {
      if (pendingFreshItems && pendingFreshItems.length) {
        liveNewsItems = pendingFreshItems;
        try {
          localStorage.setItem("pulse50_ai_feed_v7", JSON.stringify(liveNewsItems));
        } catch (e) {}
        pendingFreshItems = null;
      }
      document.getElementById("newStoriesPill").classList.add("hidden");
      activeCategory = "General";
      pinnedAlertStoryId = null;
      renderCategories();
      renderFeed();
      document.getElementById("feedContainer").scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateAlerts(stories) {
      currentTrendingAlerts = stories
        .filter(s => s.tags.includes("World") || s.tags.includes("India National"))
        .slice(0, 15);
      if (currentTrendingAlerts.length) {
        document.getElementById("alertDot").classList.remove("hidden");
      }
    }

    function openNotificationsModal() {
      const list = document.getElementById("alertsList");
      if (!currentTrendingAlerts.length) updateAlerts(liveNewsItems);
      list.innerHTML = currentTrendingAlerts.map((item, idx) => `
        <button onclick="openAlertByIndex(${idx})" class="w-full text-left p-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/70 transition">
          <div class="flex items-center justify-between text-[10px] text-indigo-400 font-semibold mb-1">
            <span>${item.source}</span>
            <span>${timeAgo(item.pubDate)}</span>
          </div>
          <p class="text-xs font-bold text-white line-clamp-2">${item.title}</p>
        </button>
      `).join("") || `<p class="text-xs text-slate-400 text-center py-6">No trending alerts yet.</p>`;

      document.getElementById("notificationsModal").classList.remove("hidden");
      document.getElementById("notificationsModal").classList.add("flex");
    }

    function closeNotificationsModal() {
      document.getElementById("notificationsModal").classList.add("hidden");
      document.getElementById("notificationsModal").classList.remove("flex");
    }

    function openAlertByIndex(idx) {
      const story = currentTrendingAlerts[idx];
      closeNotificationsModal();
      if (!story) return;
      pinnedAlertStoryId = story.id;
      activeCategory = "General";
      searchQuery = "";
      document.getElementById("searchBarContainer").classList.add("hidden");
      renderCategories();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function toggleSearchBar() {
      const bar = document.getElementById("searchBarContainer");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) {
        document.getElementById("searchInput").focus();
      } else {
        clearSearch();
      }
    }

    function handleSearchInput(val) {
      searchQuery = val.trim().toLowerCase();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function clearSearch() {
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      renderFeed();
    }

    function timeAgo(timestamp) {
      if (!timestamp) return "Just now";
      const mins = Math.max(1, Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000));
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return hrs < 24 ? `${hrs}h ago` : `${Math.floor(hrs / 24)}d ago`;
    }

    function updateHeaderStatus() {
      const lastSync = Number(localStorage.getItem("pulse50_last_sync") || 0);
      const timeStr = lastSync ? new Date(lastSync).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "Live";
      document.getElementById("syncStatus").textContent = `50-Word AI Desk • Updated ${timeStr}`;
    }

    function renderCategories() {
      document.getElementById("categoryBar").innerHTML = CATEGORIES.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          activeCategory === cat ? "bg-indigo-600 text-white shadow" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
        }">${cat === "India States" ? `States: ${selectedState}` : cat}</button>
      `).join("");
    }

    function selectCategory(cat) {
      activeCategory = cat;
      pinnedAlertStoryId = null;
      renderCategories();
      renderFeed();
      document.getElementById("feedContainer").scrollTop = 0;
    }

    function changeIndianState(newState) {
      selectedState = newState;
      localStorage.setItem("pulse50_state", newState);
      renderCategories();
      renderFeed();
    }

    function shareStory(title, link) {
      if (navigator.share) {
        navigator.share({ title, url: link }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(`${title} — ${link}`);
      }
    }

    function renderFeed() {
      const feed = document.getElementById("feedContainer");
      const allCombined = [...customPinnedNews, ...liveNewsItems];

      let filtered = allCombined.filter(item => {
        if (searchQuery) {
          const hay = `${item.title} ${item.summary} ${item.source} ${(item.stateTags || []).join(" ")}`.toLowerCase();
          return hay.includes(searchQuery);
        }
        if (activeCategory === "General") return true;
        if (activeCategory === "India States") {
          return Array.isArray(item.stateTags) && item.stateTags.includes(selectedState);
        }
        return item.primaryCategory === activeCategory || (Array.isArray(item.tags) && item.tags.includes(activeCategory));
      });

      if (pinnedAlertStoryId) {
        const pinned = allCombined.find(s => s.id === pinnedAlertStoryId);
        if (pinned) {
          filtered = [pinned, ...filtered.filter(s => s.id !== pinnedAlertStoryId)];
        }
      }

      const stateBarHtml = activeCategory === "India States" && !searchQuery ? `
        <div class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur px-4 py-2 border-b border-slate-800 flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-indigo-300">Select State:</span>
          <select onchange="changeIndianState(this.value)" class="bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700">
            ${INDIAN_STATES_28.map(st => `<option value="${st}" ${st === selectedState ? "selected" : ""}>${st}</option>`).join("")}
          </select>
        </div>` : "";

      if (!filtered.length) {
        feed.innerHTML = stateBarHtml + `
          <div class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-400">
            <p class="text-sm mb-3">No matching 50-word stories found right now.</p>
            <button onclick="fetchLiveNews('manual')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Refresh 50-Word Feed</button>
          </div>`;
        return;
      }

      feed.innerHTML = stateBarHtml + filtered.slice(0, 120).map((item, idx) => {
        const safeLink = item.link || "https://news.google.com";
        const safeSource = String(item.source || "Pulse50 Desk").replace(/'/g, "\\'");
        const isPodcast = item.primaryCategory === "Podcasts" || (Array.isArray(item.tags) && item.tags.includes("Podcasts"));
        const topicLabel = isPodcast ? "Podcast Gist" : ((item.stateTags && item.stateTags[0]) || item.primaryCategory || "News");
        const safeCat = String(topicLabel).replace(/'/g, "\\'");
        const safeTitleForJs = String(item.title || "").replace(/'/g, "\\'");
        const hasVideo = Boolean(item.video);

        return `
          <article data-story-id="${item.id}" class="news-card flex flex-col justify-between bg-slate-950 border-b border-slate-900">
            <!-- 30% Media Banner -->
            <div class="relative h-[30%] w-full overflow-hidden shrink-0 bg-slate-900">
              ${item.image ? `
                <img src="${item.image}" alt="${item.title}"
                  onload="if (this.naturalWidth < 320 || this.naturalHeight < 180) { this.onerror(); }"
                  onerror="this.parentElement.innerHTML = buildVibrantSourceBanner('${safeSource}', '${safeCat}', ${idx})"
                  class="w-full h-full object-cover object-center transition-opacity duration-300" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/75 via-transparent to-black/15"></div>
              ` : buildVibrantSourceBanner(item.source, topicLabel, idx)}
            </div>

            <!-- 70% AI-Rewritten 50-Word Summary & One-Tap Actions -->
            <div class="flex-1 px-4 py-3.5 flex flex-col justify-between overflow-hidden">
              <div>
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1.5">
                  <span class="font-semibold text-indigo-400 truncate">${item.source} • ${timeAgo(item.pubDate)}</span>
                </div>
                <h2 class="text-[17px] sm:text-lg font-extrabold leading-snug mb-2 text-white line-clamp-3">${item.title}</h2>
                <p class="text-[14.5px] leading-relaxed text-slate-300">${item.summary}</p>
              </div>

              <div class="pt-2 flex items-center gap-2 shrink-0">
                ${hasVideo ? `
                  <button onclick='openVideo(${JSON.stringify({ source: item.source, title: item.title, video: item.video, link: safeLink }).replace(/'/g, "&#39;")})' class="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    <span>▶ Watch Video</span>
                  </button>
                ` : `
                  <a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow text-center">
                    <span>${isPodcast ? "Watch Episode ↗" : "Read Full Story ↗"}</span>
                  </a>
                `}
                ${hasVideo ? `
                  <a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow text-center">
                    <span>YouTube ↗</span>
                  </a>
                ` : ""}
                <button onclick="shareStory('${safeTitleForJs}', '${safeLink}')" aria-label="Share story" class="py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700">
                  Share
                </button>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    function openVideo(item) {
      if (!item.video) {
        window.open(item.link, "_blank", "noopener,noreferrer");
        return;
      }
      document.getElementById("modalSource").textContent = item.source;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("videoFrame").src = item.video;
      document.getElementById("videoModal").classList.remove("hidden");
      document.getElementById("videoModal").classList.add("flex");
    }

    function closeVideo() {
      document.getElementById("videoFrame").src = "";
      document.getElementById("videoModal").classList.add("hidden");
      document.getElementById("videoModal").classList.remove("flex");
    }

    function openStudio() {
      document.getElementById("inputDefaultState").value = selectedState;
      document.getElementById("studioModal").classList.remove("hidden");
      document.getElementById("studioModal").classList.add("flex");
    }
    function closeStudio() {
      document.getElementById("studioModal").classList.add("hidden");
      document.getElementById("studioModal").classList.remove("flex");
    }

    function saveBranding() {
      const newState = document.getElementById("inputDefaultState").value;
      changeIndianState(newState);
      closeStudio();
    }

    function updateWordCount() {
      const words = countWords(document.getElementById("newsBody").value);
      const el = document.getElementById("wordCounter");
      el.textContent = `${words} / 50 words`;
      el.className = words > 50 ? "text-rose-400 font-bold" : "text-emerald-400 font-semibold";
    }

    function publishNews() {
      const title = document.getElementById("newsHeadline").value.trim();
      const category = document.getElementById("newsCategory").value;
      const summary = document.getElementById("newsBody").value.trim();
      const source = document.getElementById("newsSource").value.trim() || "Pulse50 Desk";
      const image = upgradeToHighResImage(document.getElementById("newsImage").value.trim());
      const link = document.getElementById("newsLink").value.trim() || "https://news.google.com";
      const video = document.getElementById("newsVideo").value.trim();

      if (!title || !summary) return alert("Please enter a headline and summary.");
      if (countWords(summary) > 52) return alert("Please keep summary within 50 words.");

      customPinnedNews.unshift({
        id: "pin-" + Date.now(),
        primaryCategory: category,
        tags: ["General", category],
        stateTags: category === "India States" ? [selectedState] : [],
        title,
        summary,
        source,
        image,
        video,
        link,
        pubDate: Date.now()
      });
      localStorage.setItem("pulse50_pinned_v7", JSON.stringify(customPinnedNews));
      renderFeed();
      closeStudio();
    }

    document.getElementById("inputDefaultState").innerHTML = INDIAN_STATES_28
      .map(st => `<option value="${st}" ${st === selectedState ? "selected" : ""}>${st}</option>`)
      .join("");

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }

    updateHeaderStatus();
    renderCategories();
    updateAlerts(liveNewsItems);
    renderFeed();
    fetchLiveNews("initial");

    setInterval(() => {
      if (document.visibilityState === "visible") fetchLiveNews("silent");
    }, 180000);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") fetchLiveNews("silent");
    });
  </script>
</body>
</html>
