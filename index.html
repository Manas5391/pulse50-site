<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pulse50 News — India &amp; World News Under 50 Words</title>
  <meta name="description" content="Live daily trending news from India (National & State-wise), Politics, Sports, Entertainment, World, and Podcasts strictly in 50 words." />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8456169895588415" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      background-color: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #feedContainer {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100%;
    }
    .news-card {
      scroll-snap-align: start;
      scroll-snap-stop: always;
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] bg-[#090d16] text-slate-100 select-none">

  <!-- Top Header -->
  <header class="shrink-0 bg-[#0d1322] border-b border-slate-800/80 px-3.5 py-2.5 flex items-center justify-between z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center font-extrabold text-white text-sm shadow-md">
        P50
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-[15px] font-bold tracking-tight text-white leading-none">Pulse50 News</h1>
          <span id="liveDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </div>
        <p id="statusSubtitle" class="text-[11px] text-slate-400 mt-0.5 leading-none">50-Word AI Desk • Live</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleSearchModal()" aria-label="Search" class="w-9 h-9 rounded-full bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-slate-200 text-sm">
        🔍
      </button>
      <button onclick="toggleAlertsModal()" aria-label="Trending Alerts" class="relative w-9 h-9 rounded-full bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-slate-200 text-sm">
        🔔
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-amber-400"></span>
      </button>
      <button onclick="manualRefresh()" class="px-3 py-1.5 rounded-full bg-emerald-950/90 border border-emerald-600/40 text-emerald-300 text-xs font-semibold flex items-center gap-1 active:scale-95">
        ↻ Live
      </button>
    </div>
  </header>

  <!-- Category Tabs -->
  <nav id="categoryBar" class="shrink-0 bg-[#0b101d] border-b border-slate-800/70 px-3 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar z-20"></nav>

  <!-- State Selector Bar (Shown only on India States tab) -->
  <div id="stateBar" class="hidden shrink-0 bg-[#0f1629] border-b border-slate-800 px-3.5 py-1.5 flex items-center justify-between gap-2 z-20">
    <label for="stateSelect" class="text-xs font-medium text-slate-300">Select State:</label>
    <select id="stateSelect" onchange="changeState(this.value)" class="bg-slate-800 text-white text-xs font-medium rounded-lg px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-indigo-500 min-w-[170px]"></select>
  </div>

  <!-- Floating New Feeds Available Pill -->
  <button id="newFeedsPill" onclick="applyPendingStories()" class="hidden fixed top-[106px] left-1/2 -translate-x-1/2 z-40 px-4 py-1.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-950/80 border border-indigo-400/40 transition-all">
    ↑ New Feeds Available
  </button>

  <!-- Main Vertical Snap Feed -->
  <main class="relative flex-1 overflow-hidden">
    <div id="feedContainer" class="no-scrollbar"></div>
  </main>

  <!-- Footer -->
  <footer id="adFooter" class="shrink-0 bg-[#0b101d] border-t border-slate-800/80 px-3.5 py-2 flex items-center justify-between text-[11px] text-slate-400 z-30">
    <span>© 2026 Pulse50 News</span>
    <div class="flex items-center gap-3">
      <a href="/about.html" class="hover:text-white">About</a>
      <a href="/contact.html" class="hover:text-white">Contact</a>
      <a href="/privacy-policy.html" class="hover:text-white">Privacy</a>
      <a href="/terms.html" class="hover:text-white">Terms</a>
    </div>
  </footer>

  <!-- Search Modal -->
  <div id="searchModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl p-4 max-w-lg w-full mx-auto mt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-white">Search 50-Word Briefs</h2>
        <button onclick="toggleSearchModal()" class="text-slate-400 hover:text-white text-sm px-2">✕</button>
      </div>
      <input id="searchInput" type="text" oninput="handleSearch(this.value)" placeholder="Search headlines, states, topics..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
      <div id="searchResults" class="mt-3 max-h-[60vh] overflow-y-auto space-y-2"></div>
    </div>
  </div>

  <!-- Trending Alerts Modal -->
  <div id="alertsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl p-4 max-w-lg w-full mx-auto mt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-white">Top Breaking Alerts</h2>
        <button onclick="toggleAlertsModal()" class="text-slate-400 hover:text-white text-sm px-2">✕</button>
      </div>
      <div id="alertsList" class="max-h-[65vh] overflow-y-auto space-y-2.5"></div>
    </div>
  </div>

  <script>
    const NEWS_FEED_URL = "https://raw.githubusercontent.com/Manas5391/pulse50-site/main/news.json";
    const CACHE_KEY = "pulse50_stories_v10";
    const MAX_FEED_WINDOW = 600;

    const CATEGORIES = [
      "General",
      "India National",
      "World",
      "India States",
      "Politics",
      "Sports",
      "Entertainment",
      "Podcasts"
    ];

    const ALL_STATES = [
      "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh",
      "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka",
      "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram",
      "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu",
      "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"
    ];

    let allStories = [];
    let pendingStories = [];
    let activeCategory = "General";
    let selectedState = "Telangana";

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function timeAgo(dateStr) {
      if (!dateStr) return "Today";
      const parsed = Date.parse(dateStr);
      if (isNaN(parsed)) return "Today";
      const diffSec = Math.max(1, Math.floor((Date.now() - parsed) / 1000));
      if (diffSec < 60) return "Just now";
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function buildVibrantSourceBanner(source = "Pulse50", category = "News", idx = 0) {
      const gradients = [
        "from-rose-600 via-pink-700 to-slate-900",
        "from-indigo-600 via-blue-700 to-slate-900",
        "from-emerald-600 via-teal-700 to-slate-900",
        "from-amber-600 via-orange-700 to-slate-900",
        "from-violet-600 via-purple-700 to-slate-900"
      ];
      const grad = gradients[idx % gradients.length];
      const cleanSource = escapeHtml(source || "Pulse50");
      const cleanCat = escapeHtml((category || "NEWS").toUpperCase());
      return `
        <div class="w-full h-full bg-gradient-to-br ${grad} flex flex-col items-center justify-center p-4 text-center">
          <div class="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-sm border border-white/25 flex items-center justify-center font-extrabold text-white text-base shadow-lg mb-2">
            P50
          </div>
          <div class="text-xs font-extrabold tracking-wider text-white uppercase">${cleanCat}</div>
          <div class="text-[11px] text-white/80 mt-0.5">${cleanSource}</div>
        </div>
      `;
    }

    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = CATEGORIES.map((cat) => {
        const isActive = cat === activeCategory;
        const label = cat === "India States" ? `States: ${selectedState}` : cat;
        const cls = isActive
          ? "bg-indigo-600 text-white shadow-sm"
          : "bg-slate-800/80 text-slate-300 hover:bg-slate-700";
        return `<button onclick="selectCategory('${cat}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition-colors ${cls}">${escapeHtml(label)}</button>`;
      }).join("");

      const stateBar = document.getElementById("stateBar");
      if (activeCategory === "India States") {
        stateBar.classList.remove("hidden");
      } else {
        stateBar.classList.add("hidden");
      }
    }

    function populateStatesDropdown() {
      const sel = document.getElementById("stateSelect");
      sel.innerHTML = ALL_STATES.map((st) =>
        `<option value="${escapeHtml(st)}" ${st === selectedState ? "selected" : ""}>${escapeHtml(st)}</option>`
      ).join("");
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderFeed(true);
    }

    function changeState(st) {
      selectedState = st;
      renderCategories();
      renderFeed(true);
    }

    // Interleaves stories across diverse topics so General never shows one category block after another
    function buildBlendedGeneralFeed(stories) {
      const candidates = stories
        .filter((s) => s.category !== "Podcasts")
        .sort((a, b) => (Date.parse(b.pubDate) || 0) - (Date.parse(a.pubDate) || 0));

      const buckets = {};
      for (const s of candidates) {
        const key = s.primaryCategory || s.category || "General";
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(s);
      }

      const keys = Object.keys(buckets);
      const blended = [];
      let added = true;
      while (added) {
        added = false;
        for (const k of keys) {
          if (buckets[k].length > 0) {
            blended.push(buckets[k].shift());
            added = true;
          }
        }
      }
      return blended;
    }

    function getFilteredStories() {
      if (activeCategory === "General") {
        return buildBlendedGeneralFeed(allStories);
      }
      if (activeCategory === "India States") {
        return allStories
          .filter((s) =>
            (Array.isArray(s.stateTags) && s.stateTags.includes(selectedState)) ||
            (s.category === "India States" && (s.title || "").toLowerCase().includes(selectedState.toLowerCase()))
          )
          .sort((a, b) => (Date.parse(b.pubDate) || 0) - (Date.parse(a.pubDate) || 0));
      }
      return allStories
        .filter((s) => s.category === activeCategory || (Array.isArray(s.tags) && s.tags.includes(activeCategory)))
        .sort((a, b) => (Date.parse(b.pubDate) || 0) - (Date.parse(a.pubDate) || 0));
    }

    function renderFeed(resetScroll = false) {
      const container = document.getElementById("feedContainer");
      const items = getFilteredStories();

      if (!items.length) {
        const msg = activeCategory === "India States"
          ? `Syncing verified AI briefs for ${escapeHtml(selectedState)}...`
          : `Fetching latest ${escapeHtml(activeCategory)} stories...`;
        container.innerHTML = `
          <div class="h-full w-full flex flex-col items-center justify-center px-6 text-center">
            <p class="text-sm text-slate-400 mb-4">${msg}</p>
            <button onclick="manualRefresh()" class="px-5 py-2.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md">
              ↻ Sync Latest Feed
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map((item, idx) => {
        const isPodcast = item.category === "Podcasts";
        const mediaBoxClass = isPodcast
          ? "relative w-full aspect-video max-h-[34%] bg-black overflow-hidden shrink-0"
          : "relative h-[30%] w-full bg-slate-900 overflow-hidden shrink-0";
        const mediaImgClass = isPodcast
          ? "w-full h-full object-contain"
          : "w-full h-full object-cover object-top";

        const safeTitle = escapeHtml(item.title || "");
        const safeSummary = escapeHtml(item.summary || "");
        const safeSource = escapeHtml(item.source || "Pulse50");
        const safeCat = escapeHtml(item.primaryCategory || item.category || "News");
        const safeLink = escapeHtml(item.video || item.link || "#");
        const ctaLabel = isPodcast ? "▶ Watch Video ↗" : "Read Full Story ↗";

        return `
          <article class="news-card flex flex-col justify-between bg-[#090d16]">
            <div class="flex-1 flex flex-col overflow-hidden">
              <div class="${mediaBoxClass}">
                ${item.image ? `
                  <img src="${escapeHtml(item.image)}" alt="${safeTitle}"
                    onload="if (!${isPodcast} && (this.naturalWidth < 360 || this.naturalHeight < 180)) { this.onerror(); }"
                    onerror="if (this.src.includes('maxresdefault.jpg')) { this.src = this.src.replace('maxresdefault.jpg', 'hqdefault.jpg'); return; } this.parentElement.innerHTML = buildVibrantSourceBanner('${safeSource.replace(/'/g, "\\'")}', '${safeCat.replace(/'/g, "\\'")}', ${idx})"
                    class="${mediaImgClass}" />
                ` : buildVibrantSourceBanner(item.source, item.primaryCategory || item.category || "News", idx)}
              </div>

              <div class="px-4 pt-3.5 pb-2 flex-1 flex flex-col overflow-hidden">
                <div class="text-xs font-semibold text-indigo-400 mb-1.5">
                  ${safeSource} • ${timeAgo(item.pubDate)}
                </div>
                <h2 class="text-[19px] leading-[1.3] font-extrabold text-white mb-2.5 line-clamp-3">
                  ${safeTitle}
                </h2>
                <p class="text-[14.5px] leading-[1.55] text-slate-300 line-clamp-6 break-words overflow-hidden">
                  ${safeSummary}
                </p>
              </div>
            </div>

            <div class="shrink-0 px-4 pb-3 pt-1.5 flex items-center gap-2.5">
              <a href="${safeLink}" target="_blank" rel="noopener noreferrer"
                class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white text-center text-[13px] font-bold shadow-md">
                ${ctaLabel}
              </a>
              <button onclick="shareStory(${idx})" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-[13px] font-semibold">
                Share
              </button>
            </div>
          </article>
        `;
      }).join("");

      if (resetScroll) {
        container.scrollTop = 0;
      }
    }

    async function shareStory(idx) {
      const items = getFilteredStories();
      const item = items[idx];
      if (!item) return;
      const shareData = {
        title: item.title,
        text: `${item.title}\n\n${item.summary}\n\nRead on Pulse50:`,
        url: item.link || window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch {}
      } else {
        navigator.clipboard?.writeText(`${shareData.text} ${shareData.url}`);
        alert("Story link copied to clipboard!");
      }
    }

    function mergeStories(incoming) {
      const existingKeys = new Set(allStories.map((s) => (s.title || "").toLowerCase().trim()));
      const brandNew = incoming.filter((s) => s.title && !existingKeys.has(s.title.toLowerCase().trim()));
      if (!brandNew.length) return 0;

      const container = document.getElementById("feedContainer");
      if (allStories.length > 0 && container && container.scrollTop >= 20) {
        pendingStories = [...brandNew, ...pendingStories];
        document.getElementById("newFeedsPill").classList.remove("hidden");
      } else {
        allStories = [...brandNew, ...allStories].slice(0, MAX_FEED_WINDOW);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(allStories)); } catch {}
        renderFeed(false);
      }
      return brandNew.length;
    }

    function applyPendingStories() {
      if (!pendingStories.length) return;
      allStories = [...pendingStories, ...allStories].slice(0, MAX_FEED_WINDOW);
      pendingStories = [];
      document.getElementById("newFeedsPill").classList.add("hidden");
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(allStories)); } catch {}
      renderFeed(true);
    }

    async function fetchFeed(isManual = false) {
      const sub = document.getElementById("statusSubtitle");
      if (isManual) sub.textContent = "Syncing latest AI briefs...";
      try {
        const res = await fetch(`${NEWS_FEED_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          if (allStories.length === 0) {
            allStories = data.slice(0, MAX_FEED_WINDOW);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(allStories)); } catch {}
            renderFeed(true);
          } else {
            mergeStories(data);
          }
        }
        sub.textContent = "50-Word AI Desk • Live";
      } catch (e) {
        sub.textContent = "50-Word AI Desk • Cached";
      }
    }

    function manualRefresh() {
      fetchFeed(true);
    }

    function toggleSearchModal() {
      const modal = document.getElementById("searchModal");
      modal.classList.toggle("hidden");
      if (!modal.classList.contains("hidden")) {
        document.getElementById("searchInput").focus();
      }
    }

    function handleSearch(q) {
      const box = document.getElementById("searchResults");
      const term = (q || "").trim().toLowerCase();
      if (!term) { box.innerHTML = ""; return; }
      const matches = allStories.filter((s) =>
        (s.title || "").toLowerCase().includes(term) ||
        (s.summary || "").toLowerCase().includes(term) ||
        (s.source || "").toLowerCase().includes(term)
      ).slice(0, 15);

      box.innerHTML = matches.length
        ? matches.map((m) => `
            <a href="${escapeHtml(m.link || "#")}" target="_blank" class="block p-3 rounded-xl bg-slate-800/80 hover:bg-slate-800">
              <div class="text-[11px] text-indigo-400 font-semibold">${escapeHtml(m.category)} • ${escapeHtml(m.source)}</div>
              <div class="text-xs font-bold text-white mt-0.5">${escapeHtml(m.title)}</div>
            </a>
          `).join("")
        : `<p class="text-xs text-slate-400 text-center py-4">No matching briefs found.</p>`;
    }

    function toggleAlertsModal() {
      const modal = document.getElementById("alertsModal");
      modal.classList.toggle("hidden");
      if (!modal.classList.contains("hidden")) {
        const list = document.getElementById("alertsList");
        const alerts = buildBlendedGeneralFeed(allStories).slice(0, 15);
        list.innerHTML = alerts.map((s) => `
          <a href="${escapeHtml(s.link || "#")}" target="_blank" class="block p-3 rounded-xl bg-slate-800/80 hover:bg-slate-800">
            <div class="text-[11px] text-amber-400 font-semibold">${escapeHtml(s.source)} • ${timeAgo(s.pubDate)}</div>
            <div class="text-xs font-bold text-white mt-0.5">${escapeHtml(s.title)}</div>
          </a>
        `).join("");
      }
    }

    // Boot
    (function init() {
      populateStatesDropdown();
      renderCategories();
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
        if (Array.isArray(cached) && cached.length > 0) {
          allStories = cached;
        }
      } catch {}
      renderFeed(true);
      fetchFeed(false);
      setInterval(() => fetchFeed(false), 180000);
    })();
  </script>
</body>
</html>
