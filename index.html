<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pulse50 News — 50-Word AI Desk</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#020617" />
  <!-- Google AdSense Verification & Ad Tag -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8456169895588415" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100dvh;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: contain;
    }
    #feedContainer {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    #feedContainer::-webkit-scrollbar,
    #categoryBar::-webkit-scrollbar {
      display: none;
    }
    .news-card {
      height: 100%;
      min-height: 100%;
      max-height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] bg-slate-950 text-slate-100 select-none">

  <!-- Top App Header -->
  <header class="shrink-0 bg-slate-950 border-b border-slate-800/90 px-3 py-2 flex items-center justify-between gap-2 z-30">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-xs text-white shrink-0 shadow">P50</div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <h1 id="appTitle" class="font-extrabold text-sm text-white truncate">Pulse50 News</h1>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
        </div>
        <p id="syncStatus" class="text-[10px] text-slate-400 truncate">50-Word AI Desk • Live</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="toggleSearchBar()" aria-label="Search" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs">🔍</button>
      <button onclick="openNotificationsModal()" aria-label="Alerts" class="relative w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs">
        🔔
        <span id="alertDot" class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="fetchLiveNews('manual')" class="px-2.5 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-700/50 text-emerald-300 text-[11px] font-bold flex items-center gap-1">
        <span id="refreshIcon">↻</span><span>Live</span>
      </button>
      <button onclick="openStudio()" class="px-2.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold">Studio</button>
    </div>
  </header>

  <!-- Locked Horizontal Category Tabs (No Auto-Swipe Switching) -->
  <nav id="categoryBar" class="shrink-0 bg-slate-950 border-b border-slate-800/80 px-3 py-2 flex items-center gap-2 overflow-x-auto z-30"></nav>

  <!-- Expandable Keyword Search Bar -->
  <div id="searchBarBox" class="hidden shrink-0 bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center gap-2 z-30">
    <input id="searchInput" type="text" oninput="handleSearch(this.value)" placeholder="Search headlines, topics, podcasts..." class="flex-1 bg-slate-800 text-white text-xs px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500" />
    <button onclick="clearSearch()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold">✕</button>
  </div>

  <!-- Compact State Selector Bar (Shown ONLY on India States tab, outside scroll container so cards never jump) -->
  <div id="stateSelectorBar" class="hidden shrink-0 bg-slate-900 border-b border-slate-800 px-3 py-1.5 flex items-center justify-between gap-2 z-30">
    <span class="text-xs font-semibold text-indigo-300">Select State:</span>
    <select id="stateDropdown" onchange="changeIndianState(this.value)" class="bg-slate-800 text-white text-xs font-semibold px-3 py-1 rounded-lg border border-slate-700 focus:outline-none"></select>
  </div>

  <!-- Main Viewport Area -->
  <main class="relative flex-1 min-h-0 w-full overflow-hidden">
    <!-- Floating "New Feeds Available" Pop-Up Pill -->
    <button id="newFeedsPill" onclick="applyPendingStories()" class="hidden fixed top-[112px] left-1/2 -translate-x-1/2 z-40 px-4 py-1.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-xl shadow-black/70 border border-indigo-400/50 flex items-center gap-1.5 animate-bounce">
      <span>↑</span><span>New Feeds Available</span>
    </button>

    <!-- Full-Height Snap-Scroll Feed -->
    <div id="feedContainer"></div>
  </main>

  <!-- Clean AdSense-Compliant Footer -->
  <footer class="shrink-0 bg-slate-950 border-t border-slate-800/90 px-3 py-1.5 flex items-center justify-between text-[11px] text-slate-400 z-30">
    <span>© 2026 Pulse50 News</span>
    <div class="flex items-center gap-3">
      <a href="/about.html" class="hover:text-white">About</a>
      <a href="/contact.html" class="hover:text-white">Contact</a>
      <a href="/privacy-policy.html" class="hover:text-white">Privacy</a>
      <a href="/terms.html" class="hover:text-white">Terms</a>
    </div>
  </footer>

  <!-- Video & Episode Player Modal -->
  <div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex-col items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <span id="modalSource" class="text-xs font-bold text-indigo-400 truncate">Video Report</span>
        <button onclick="closeVideo()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs font-bold text-white">✕ Close</button>
      </div>
      <div class="aspect-video w-full bg-black">
        <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="p-4">
        <h3 id="modalTitle" class="text-sm font-bold text-white mb-1.5"></h3>
        <p id="modalSummary" class="text-xs text-slate-300 leading-relaxed mb-3"></p>
        <a id="modalArticleLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Open Original Source ↗</a>
      </div>
    </div>
  </div>

  <!-- Trending Notifications Drawer -->
  <div id="notificationsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex-col justify-end sm:justify-center items-center p-3">
    <div class="w-full max-w-md max-h-[80dvh] bg-slate-900 rounded-2xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-extrabold text-white">Trending World & India Alerts</h3>
          <p class="text-[11px] text-slate-400">Tap any alert to jump straight to that card</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="enablePushAlerts()" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-bold">Enable Push</button>
          <button onclick="closeNotificationsModal()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-xs font-bold">✕</button>
        </div>
      </div>
      <div id="alertsList" class="p-3 overflow-y-auto space-y-2"></div>
    </div>
  </div>

  <!-- Owner Studio Modal -->
  <div id="studioModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-2xl border border-slate-800 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-white">Pulse50 Editorial Studio</h3>
        <button onclick="closeStudio()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs font-bold">✕</button>
      </div>
      <input id="newsHeadline" type="text" placeholder="Breaking Headline" class="w-full bg-slate-800 text-xs text-white px-3 py-2 rounded-lg border border-slate-700" />
      <select id="newsCategory" class="w-full bg-slate-800 text-xs text-white px-3 py-2 rounded-lg border border-slate-700">
        <option value="General">General</option>
        <option value="India National">India National</option>
        <option value="World">World</option>
        <option value="India States">India States</option>
        <option value="Politics">Politics</option>
        <option value="Sports">Sports</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Podcasts">Podcasts</option>
      </select>
      <textarea id="newsBody" rows="3" placeholder="Write complete 45-50 word news brief..." class="w-full bg-slate-800 text-xs text-white px-3 py-2 rounded-lg border border-slate-700"></textarea>
      <input id="newsSource" type="text" placeholder="Source Name (e.g., Pulse50 Desk)" class="w-full bg-slate-800 text-xs text-white px-3 py-2 rounded-lg border border-slate-700" />
      <input id="newsImage" type="text" placeholder="Image URL (optional)" class="w-full bg-slate-800 text-xs text-white px-3 py-2 rounded-lg border border-slate-700" />
      <button onclick="publishCustomStory()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">Publish Top Story</button>
    </div>
  </div>

  <script>
    const CATEGORIES = ["General", "India National", "World", "India States", "Politics", "Sports", "Entertainment", "Podcasts"];
    const INDIAN_STATES = [
      "Odisha", "Telangana", "Andhra Pradesh", "Maharashtra", "Karnataka",
      "Tamil Nadu", "Uttar Pradesh", "West Bengal", "Delhi", "Bihar",
      "Gujarat", "Rajasthan", "Kerala", "Madhya Pradesh", "Punjab",
      "Assam", "Jharkhand", "Chhattisgarh", "Haryana", "Uttarakhand",
      "Himachal Pradesh", "Goa", "Tripura", "Meghalaya", "Manipur",
      "Nagaland", "Arunachal Pradesh", "Mizoram", "Sikkim"
    ];

    const MAX_FEED_WINDOW = 600;
    let activeCategory = "General";
    let selectedState = localStorage.getItem("pulse50_state") || "Odisha";
    let searchQuery = "";

    const SEED_STORIES = [
      {
        id: "seed-1",
        primaryCategory: "General",
        tags: ["General", "India National"],
        stateTags: [],
        title: "India Expands Digital Public Infrastructure to Rural Cooperatives",
        summary: "The Union Ministry launched unified digital payment and crop advisory systems across forty thousand rural agricultural societies. Officials confirmed the platform will streamline direct benefit transfers, real-time mandi pricing, and localized weather alerts for smallholder farmers nationwide.",
        source: "India National Desk",
        image: "",
        video: "",
        link: "https://www.thehindu.com/news/national/",
        pubDate: new Date().toISOString()
      }
    ];

    function safeLoadJson(key, fallback) {
      try {
        const val = JSON.parse(localStorage.getItem(key) || "null");
        return val !== null ? val : fallback;
      } catch {
        return fallback;
      }
    }

    let storiesStore = safeLoadJson("pulse50_store_v5", SEED_STORIES);
    let pendingNewStories = [];
    let currentAlerts = [];

    const GRADIENTS = [
      "from-indigo-600 via-purple-600 to-pink-600",
      "from-emerald-600 via-teal-600 to-cyan-700",
      "from-rose-600 via-orange-500 to-amber-500",
      "from-blue-600 via-indigo-600 to-violet-700",
      "from-fuchsia-600 via-pink-600 to-rose-600"
    ];

    function getSourceInitials(src) {
      return (src || "P50")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(w => w[0].toUpperCase())
        .join("") || "P50";
    }

    function sanitizeSummary(raw, title) {
      let clean = (raw || "")
        .replace(/https?:\/\/\S+/g, "")
        .replace(/#\w+/g, "")
        .replace(/\s+/g, " ")
        .trim();
      if (!clean || /key developments and official updates regarding/i.test(clean)) {
        return title;
      }
      return clean;
    }

    function timeAgo(iso) {
      if (!iso) return "Live";
      const mins = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return hrs < 24 ? `${hrs}h ago` : `${Math.floor(hrs / 24)}d ago`;
    }

    function renderCategories() {
      document.getElementById("categoryBar").innerHTML = CATEGORIES.map(cat => {
        const label = cat === "India States" ? `States: ${selectedState}` : cat;
        const active = activeCategory === cat;
        return `<button onclick="selectCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shrink-0 ${
          active ? "bg-indigo-600 text-white shadow-md" : "bg-slate-800/90 text-slate-300 hover:bg-slate-700"
        }">${label}</button>`;
      }).join("");

      const stateBar = document.getElementById("stateSelectorBar");
      if (activeCategory === "India States") {
        stateBar.classList.remove("hidden");
        document.getElementById("stateDropdown").innerHTML = INDIAN_STATES.map(st =>
          `<option value="${st}" ${st === selectedState ? "selected" : ""}>${st}</option>`
        ).join("");
      } else {
        stateBar.classList.add("hidden");
      }
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderFeed(true);
    }

    function changeIndianState(newState) {
      selectedState = newState;
      localStorage.setItem("pulse50_state", newState);
      renderCategories();
      renderFeed(true);
    }

    function toggleSearchBar() {
      const box = document.getElementById("searchBarBox");
      box.classList.toggle("hidden");
      if (!box.classList.contains("hidden")) {
        document.getElementById("searchInput").focus();
      } else {
        clearSearch();
      }
    }

    function handleSearch(val) {
      searchQuery = (val || "").trim().toLowerCase();
      renderFeed(true);
    }

    function clearSearch() {
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("searchBarBox").classList.add("hidden");
      renderFeed(true);
    }

    function getFilteredStories() {
      let list = [...storiesStore];

      if (searchQuery) {
        return list.filter(item =>
          `${item.title} ${item.summary} ${item.source} ${(item.stateTags || []).join(" ")}`
            .toLowerCase()
            .includes(searchQuery)
        );
      }

      if (activeCategory === "Podcasts") {
        return list.filter(i => i.primaryCategory === "Podcasts" || (i.tags || []).includes("Podcasts"));
      }
      if (activeCategory === "India States") {
        return list.filter(i =>
          (i.stateTags || []).some(s => s.toLowerCase() === selectedState.toLowerCase())
        );
      }
      if (activeCategory !== "General") {
        return list.filter(i =>
          i.primaryCategory === activeCategory || (i.tags || []).includes(activeCategory)
        );
      }
      return list;
    }

    function renderFeed(resetScroll = false) {
      const feed = document.getElementById("feedContainer");
      const items = getFilteredStories();

      if (!items.length) {
        feed.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center p-6 text-center">
            <p class="text-sm text-slate-400 mb-3">No stories found for ${activeCategory === "India States" ? selectedState : activeCategory}.</p>
            <button onclick="fetchLiveNews('manual')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">↻ Sync Latest Feed</button>
          </div>`;
        return;
      }

      feed.innerHTML = items.map((item, idx) => {
        const grad = GRADIENTS[idx % GRADIENTS.length];
        const initials = getSourceInitials(item.source);
        const isPodcast = item.primaryCategory === "Podcasts" || (item.tags || []).includes("Podcasts");
        const badgeText = isPodcast ? "PODCAST GIST" : (activeCategory === "India States" ? selectedState.toUpperCase() : (item.primaryCategory || "NEWS").toUpperCase());
        const cleanSummary = sanitizeSummary(item.summary, item.title);
        const safeItemJson = JSON.stringify(item).replace(/'/g, "&#39;");

        const mediaBlock = item.image
          ? `<div class="relative h-[30%] w-full bg-slate-900 shrink-0 overflow-hidden">
               <img src="${item.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full bg-gradient-to-br ${grad} flex flex-col items-center justify-center p-3 text-center\\'><div class=\\'w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-black text-sm text-white mb-1\\'>${initials}</div><div class=\\'text-xs font-bold text-white\\'>${item.source}</div><span class=\\'mt-1 px-2 py-0.5 rounded-full bg-black/25 text-[9px] font-bold tracking-wider text-white\\'>${badgeText}</span></div>'" class="w-full h-full object-cover object-top" />
             </div>`
          : `<div class="relative h-[30%] w-full bg-gradient-to-br ${grad} shrink-0 flex flex-col items-center justify-center p-3 text-center overflow-hidden">
               <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-black text-sm text-white mb-1">${initials}</div>
               <div class="text-xs font-bold text-white">${item.source}</div>
               <span class="mt-1 px-2.5 py-0.5 rounded-full bg-black/25 text-[9px] font-bold tracking-wider text-white">${badgeText}</span>
             </div>`;

        const actionButtons = (isPodcast || item.video)
          ? `<button onclick='openVideo(${safeItemJson})' class="flex-1 py-2.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow">▶ Watch Video</button>
             <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center">YouTube ↗</a>
             <button onclick='shareStory(${safeItemJson})' class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs">Share</button>`
          : `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center justify-center gap-1 shadow">Read Full Story ↗</a>
             <button onclick='shareStory(${safeItemJson})' class="py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs">Share</button>`;

        return `
          <article class="news-card flex flex-col bg-slate-950 overflow-hidden">
            ${mediaBlock}
            <div class="flex-1 min-h-0 px-4 py-3 flex flex-col justify-between">
              <div class="min-h-0 overflow-hidden">
                <div class="text-[11px] font-semibold text-indigo-400 mb-1 truncate">${item.source} • ${timeAgo(item.pubDate)}</div>
                <h2 class="text-[17px] font-extrabold leading-snug text-white mb-2 line-clamp-3">${item.title}</h2>
                <p class="text-[13.5px] leading-relaxed text-slate-300 line-clamp-5 break-words">${cleanSummary}</p>
              </div>
              <div class="pt-2 shrink-0 flex items-center gap-2">
                ${actionButtons}
              </div>
            </div>
          </article>`;
      }).join("");

      if (resetScroll) {
        feed.style.scrollBehavior = "auto";
        feed.scrollTop = 0;
        feed.style.scrollBehavior = "smooth";
      }
    }

    async function fetchLiveNews(mode = "silent") {
      const icon = document.getElementById("refreshIcon");
      if (icon && mode === "manual") icon.classList.add("animate-spin");

      try {
        const res = await fetch(`./news.json?v=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const freshList = await res.json();
        if (!Array.isArray(freshList) || !freshList.length) return;

        const existingKeys = new Set(storiesStore.map(s => (s.title || "").toLowerCase().trim()));
        const brandNew = freshList.filter(s => s.title && !existingKeys.has(s.title.toLowerCase().trim()));

        if (brandNew.length > 0) {
          if (mode === "manual") {
            storiesStore = [...brandNew, ...storiesStore].slice(0, MAX_FEED_WINDOW);
            localStorage.setItem("pulse50_store_v5", JSON.stringify(storiesStore));
            pendingNewStories = [];
            document.getElementById("newFeedsPill").classList.add("hidden");
            renderFeed(true);
          } else {
            const pendingKeys = new Set(pendingNewStories.map(s => s.title.toLowerCase().trim()));
            const uniqueNew = brandNew.filter(s => !pendingKeys.has(s.title.toLowerCase().trim()));
            if (uniqueNew.length > 0) {
              pendingNewStories = [...uniqueNew, ...pendingNewStories];
              document.getElementById("newFeedsPill").classList.remove("hidden");
            }
          }
        } else if (storiesStore.length <= 1) {
          storiesStore = freshList.slice(0, MAX_FEED_WINDOW);
          localStorage.setItem("pulse50_store_v5", JSON.stringify(storiesStore));
          renderFeed(true);
        }

        const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("syncStatus").textContent = `50-Word AI Desk • Updated ${timeStr}`;
      } catch (e) {
        console.warn("Sync skipped:", e);
      } finally {
        if (icon) icon.classList.remove("animate-spin");
      }
    }

    function applyPendingStories() {
      if (pendingNewStories.length > 0) {
        storiesStore = [...pendingNewStories, ...storiesStore].slice(0, MAX_FEED_WINDOW);
        localStorage.setItem("pulse50_store_v5", JSON.stringify(storiesStore));
        pendingNewStories = [];
      }
      document.getElementById("newFeedsPill").classList.add("hidden");
      activeCategory = "General";
      renderCategories();
      renderFeed(true);
    }

    function openVideo(item) {
      document.getElementById("modalSource").textContent = item.source;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalSummary").textContent = sanitizeSummary(item.summary, item.title);
      document.getElementById("videoFrame").src = item.video || "";
      document.getElementById("modalArticleLink").href = item.link || "#";
      document.getElementById("videoModal").classList.remove("hidden");
      document.getElementById("videoModal").classList.add("flex");
    }

    function closeVideo() {
      document.getElementById("videoFrame").src = "";
      document.getElementById("videoModal").classList.add("hidden");
      document.getElementById("videoModal").classList.remove("flex");
    }

    function shareStory(item) {
      if (navigator.share) {
        navigator.share({ title: item.title, text: item.summary, url: item.link }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(`${item.title} — ${item.link}`);
      }
    }

    function openNotificationsModal() {
      if (pendingNewStories.length > 0) {
        storiesStore = [...pendingNewStories, ...storiesStore].slice(0, MAX_FEED_WINDOW);
        pendingNewStories = [];
        document.getElementById("newFeedsPill").classList.add("hidden");
      }
      currentAlerts = storiesStore.slice(0, 15);
      document.getElementById("alertsList").innerHTML = currentAlerts.map((item, i) => `
        <div onclick="jumpToAlert(${i})" class="p-3 rounded-xl bg-slate-800/90 hover:bg-slate-800 border border-slate-700/60 cursor-pointer">
          <div class="text-[10px] font-bold text-indigo-400 mb-0.5">${item.source} • ${timeAgo(item.pubDate)}</div>
          <div class="text-xs font-bold text-white line-clamp-2">${item.title}</div>
        </div>
      `).join("");
      document.getElementById("notificationsModal").classList.remove("hidden");
      document.getElementById("notificationsModal").classList.add("flex");
    }

    function closeNotificationsModal() {
      document.getElementById("notificationsModal").classList.add("hidden");
      document.getElementById("notificationsModal").classList.remove("flex");
    }

    function jumpToAlert(idx) {
      const target = currentAlerts[idx];
      closeNotificationsModal();
      if (!target) return;
      storiesStore = [target, ...storiesStore.filter(s => s.title !== target.title)];
      activeCategory = "General";
      renderCategories();
      renderFeed(true);
    }

    function enablePushAlerts() {
      if ("Notification" in window) {
        Notification.requestPermission().then(perm => {
          if (perm === "granted" && storiesStore[0]) {
            new Notification("Pulse50 Breaking Alert", { body: storiesStore[0].title, icon: "/icon-192.png" });
          }
        });
      }
    }

    function openStudio() {
      document.getElementById("studioModal").classList.remove("hidden");
      document.getElementById("studioModal").classList.add("flex");
    }
    function closeStudio() {
      document.getElementById("studioModal").classList.add("hidden");
      document.getElementById("studioModal").classList.remove("flex");
    }

    function publishCustomStory() {
      const title = document.getElementById("newsHeadline").value.trim();
      const primaryCategory = document.getElementById("newsCategory").value;
      const summary = document.getElementById("newsBody").value.trim();
      const source = document.getElementById("newsSource").value.trim() || "Pulse50 Desk";
      const image = document.getElementById("newsImage").value.trim();
      if (!title || !summary) return;
      storiesStore.unshift({
        id: "custom-" + Date.now(),
        primaryCategory,
        tags: ["General", primaryCategory],
        stateTags: primaryCategory === "India States" ? [selectedState] : [],
        title,
        summary,
        source,
        image,
        video: "",
        link: "https://dashing-manatee-b344df.netlify.app",
        pubDate: new Date().toISOString()
      });
      localStorage.setItem("pulse50_store_v5", JSON.stringify(storiesStore));
      closeStudio();
      renderFeed(true);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }

    renderCategories();
    renderFeed(true);
    fetchLiveNews("initial");
    setInterval(() => fetchLiveNews("silent"), 180000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") fetchLiveNews("silent");
    });
  </script>
</body>
</html>
